<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberOS - Ethical Hacker Premium</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; font-src 'self' data:;">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/animate.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --neon-cyan: 180, 100%, 50%; --void-bg: #050505; --border-glass: rgba(0, 255, 255, 0.2); }
        body { background-color: var(--void-bg); color: white; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; height: 100vh; }
        .cyber-grid { position: fixed; inset: 0; background: linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; pointer-events: none; }
        
        /* Responsive Window System */
        .window { position: absolute; width: 85vw; height: 80vh; max-width: 1200px; background: rgba(5, 5, 15, 0.9); border: 1px solid rgba(0, 255, 255, 0.15); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 20px rgba(0,255,255,0.05); display: flex; flex-direction: column; -webkit-backdrop-filter: blur(25px); backdrop-filter: blur(25px); z-index: 100; transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s; pointer-events: auto; overflow: hidden; }
        
        @media (max-width: 768px) {
            .window { width: 98vw !important; height: 85vh !important; top: 45% !important; border-radius: 0; }
            .desktop-icons { grid-template-columns: repeat(2, 1fr); top: 20px; left: 10px; right: 10px; width: auto; }
            .task-item { padding: 5px 8px; font-size: 0.65rem; margin-right: 5px; }
            .taskbar-time { display: none; }
        }

        .window-header { padding: 12px 18px; background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent); border-bottom: 1px solid rgba(255,255,255,0.1); cursor: move; display: flex; justify-content: space-between; align-items: center; }
        .window-body { flex-grow: 1; overflow: auto; padding: 0; position: relative; }
        .window-controls span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 8px; cursor: pointer; }
        
        /* Taskbar */
        .cyber-taskbar { position: fixed; bottom: 0; left: 0; right: 0; height: 50px; background: rgba(0,0,0,0.8); border-top: 1px solid rgba(0,255,255,0.2); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 20000; display: flex; align-items: center; padding: 0 15px; }
        .task-item { padding: 5px 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; margin-right: 10px; cursor: pointer; font-size: 0.8rem; font-weight: bold; color: #0ff; transition: 0.2s; }
        .task-item.active { background: rgba(0,255,255,0.1); border-color: #0ff; box-shadow: 0 0 10px rgba(0,255,255,0.3); }
        
        /* Notifications */
        .notification-container { position: fixed; top: 20px; right: 20px; z-index: 30000; pointer-events: none; }
        .notification-toast { background: rgba(10,10,10,0.95); border-left: 4px solid var(--neon-cyan); color: white; padding: 15px 25px; margin-bottom: 10px; border-radius: 4px; box-shadow: 0 5px 25px rgba(0,0,0,0.6); pointer-events: auto; min-width: 250px; }
        
        /* Desktop */
        .desktop-icons { position: absolute; top: 30px; left: 30px; display: grid; grid-template-rows: repeat(auto-fill, 100px); gap: 20px; }
        .desktop-icon { width: 80px; text-align: center; cursor: pointer; transition: 0.2s; }
        .desktop-icon:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px #0ff); }
        .icon-box { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .icon-box.bg-gradient-toolkit { background: linear-gradient(135deg, #6f42c1, #e83e8c); }
        
        #window-container { position: absolute; inset: 0; pointer-events: none; }
        
        /* Splash Screen */
        .splash-overlay { position: fixed; inset: 0; background: var(--void-bg); z-index: 99999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s; }
        .loading-hidden { opacity: 0; pointer-events: none; }
        .glass { background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(0, 255, 255, 0.2); box-shadow: 0 0 15px rgba(0, 255, 255, 0.1); border-radius: 8px; backdrop-filter: blur(10px); }
        .shadow-glow { box-shadow: 0 0 20px rgba(0, 255, 255, 0.15); }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>

    <!-- CINEMATIC SPLASH -->
    <div id="splash-intro" class="splash-overlay d-flex flex-column align-items-center justify-content-center">
        <div class="terminal-loader glass p-4" style="max-width: 600px; width: 90%;">
            <div id="splash-terminal" class="font-monospace text-primary small"></div>
            <div class="progress mt-4" style="height: 4px; background: rgba(255,255,255,0.1);">
                <div id="splash-progress" class="progress-bar bg-info" style="width: 0%"></div>
            </div>
            <div class="text-center mt-3">
                <button class="btn btn-link btn-sm text-muted text-decoration-none" onclick="os.hideSplash()" style="font-size: 0.7rem; opacity: 0.5;">[ PULAR INICIALIZAÇÃO ]</button>
            </div>
        </div>
    </div>

    <!-- AUTH LAYER -->
    <div id="auth-layer" class="animate__animated animate__fadeIn d-none">
        <div class="container d-flex align-items-center justify-content-center min-vh-100">
            <div class="glass-card p-5 rounded-4 shadow-glow" style="max-width: 450px; width: 100%;">
                <div class="text-center mb-5">
                    <h1 class="cyber-title fs-2 mb-2">ETHICAL HACKER</h1>
                    <div class="badge bg-primary px-3 py-1">PREMIUM OS v5.2</div>
                </div>
                
                <ul class="nav nav-pills nav-justified mb-4 bg-dark rounded-pill p-1">
                    <li class="nav-item"><button class="nav-link active rounded-pill" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane">Acesso</button></li>
                    <li class="nav-item"><button class="nav-link rounded-pill" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane">Novo Agente</button></li>
                </ul>
                
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="login-pane">
                        <form id="loginForm">
                            <div class="mb-4">
                                <label class="form-label small text-muted">USUÁRIO</label>
                                <input type="text" class="form-control cyber-input" id="loginUsername" placeholder="Digite seu nome" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label small text-muted">SENHA</label>
                                <input type="password" class="form-control cyber-input" id="loginPassword" placeholder="Sua senha " required>
                            </div>
                            <button type="submit" class="btn btn-cyber primary w-100 py-3 mb-3">ENTRAR NO SISTEMA</button>
                            
                            <div class="text-center">
                                <p class="text-muted small mb-3">OU</p>
                                <button type="button" class="btn btn-outline-warning w-100 py-2" onclick="loginGuest()">
                                    <i class="fas fa-user-secret me-2"></i> ACESSO RÁPIDO (MODO CONVIDADO)
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="register-pane">
                        <form id="registerForm">
                            <div class="mb-3"><label class="form-label small text-muted">NOME REAL</label><input type="text" class="form-control cyber-input" id="registerName" title="Digite seu nome real" required></div>
                            <div class="mb-3"><label class="form-label small text-muted">CODINOME</label><input type="text" class="form-control cyber-input" id="registerUsername" title="Escolha um codinome" required></div>
                            <div class="mb-3"><label class="form-label small text-muted">SENHA</label><input type="password" class="form-control cyber-input" id="registerPassword" title="Crie uma senha segura" required></div>
                            <button type="submit" class="btn btn-success w-100 py-3">CADASTRAR</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DESKTOP LAYER -->
    <div id="desktop-layer" class="d-none animate__animated animate__fadeIn">
        <div class="desktop-icons">
            <div class="desktop-icon" onclick="showDashboard()">
                <div class="icon-box bg-primary"><i class="fas fa-id-card fs-3"></i></div>
                <span class="small fw-bold">PERFIL</span>
            </div>
            <div class="desktop-icon" onclick="startGame('logica')">
                <div class="icon-box bg-danger"><i class="fas fa-bug fs-3"></i></div>
                <span class="small fw-bold">PENTEST</span>
            </div>
            <div class="desktop-icon" onclick="startDefenseMode()">
                <div class="icon-box bg-info"><i class="fas fa-shield-alt fs-3"></i></div>
                <span class="small fw-bold">SOC</span>
            </div>
            <div class="desktop-icon" onclick="startBotWar()">
                <div class="icon-box bg-warning"><i class="fas fa-bolt fs-3"></i></div>
                <span class="small fw-bold">ARENA</span>
            </div>
            <div class="desktop-icon" onclick="showGlossary()">
                <div class="icon-box bg-success"><i class="fas fa-book fs-3"></i></div>
                <span class="small fw-bold">GLOSSÁRIO</span>
            </div>
            <div class="desktop-icon" onclick="showToolkit()">
                <div class="icon-box bg-gradient-toolkit"><i class="fas fa-toolbox fs-3"></i></div>
                <span class="small fw-bold">TOOLKIT</span>
            </div>
        </div>

        <div id="window-container"></div>

        <div class="cyber-taskbar">
            <div id="taskbar-items" class="d-flex align-items-center flex-grow-1"></div>
            <div class="taskbar-actions me-3">
                <button class="btn btn-outline-danger btn-sm px-3" onclick="logout()" title="Encerrar Sessão">
                    <i class="fas fa-power-off me-1"></i> SAIR
                </button>
            </div>
            <div class="taskbar-time text-end">
                <div id="os-clock" class="fw-bold">00:00</div>
                <div id="os-date" class="small text-muted">22 APR</div>
            </div>
        </div>
    </div>

    <!-- Core OS Logic -->
    <script src="js/security.js"></script>
    <script>
        const os = {
            windows: {},
            zindex: 100,
            introInterval: null,

            init() {
                this.updateClock(); // Call immediately
                this.initIntro();
                this.createNotificationContainer();
                setInterval(() => this.updateClock(), 1000); // Check every second for better precision, or 60000
            },

            updateClock() {
                const now = new Date();
                const clock = document.getElementById('os-clock');
                const dateEl = document.getElementById('os-date');
                if (clock) clock.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                if (dateEl) {
                    const day = now.getDate();
                    const month = now.toLocaleString('en-US', { month: 'short' }).toUpperCase();
                    dateEl.textContent = `${day} ${month}`;
                }
            },

            createNotificationContainer() {
                if (!document.getElementById('notification-container')) {
                    const container = document.createElement('div');
                    container.id = 'notification-container';
                    container.className = 'notification-container';
                    document.body.appendChild(container);
                }
            },

            showNotification(msg, type = 'info') {
                const container = document.getElementById('notification-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `notification-toast animate__animated animate__slideInRight`;
                if (type === 'success') toast.style.borderLeftColor = '#00ff88';
                if (type === 'danger') toast.style.borderLeftColor = '#ff3366';
                const safeMsg = typeof window.security !== 'undefined' ? security.escapeHTML(msg) : msg;
                toast.innerHTML = `<div class="d-flex align-items-center"><i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'danger' ? 'fa-exclamation-triangle' : 'fa-info-circle'} me-3"></i><div>${safeMsg}</div></div>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.replace('animate__slideInRight', 'animate__slideOutRight');
                    setTimeout(() => toast.remove(), 500);
                }, 4000);
            },

            hideSplash() {
                const splash = document.getElementById('splash-intro');
                if (splash) {
                    splash.classList.add('loading-hidden');
                    if (this.introInterval) clearInterval(this.introInterval);
                }
            },

            initIntro() {
                const term = document.getElementById('splash-terminal');
                const progress = document.getElementById('splash-progress');
                const logs = ["> INITIALIZING KERNEL...", "> LOADING NEURAL MODULES...", "> ESTABLISHING TUNNEL...", "> SYSTEM READY."];
                let i = 0;
                this.introInterval = setInterval(() => {
                    if (i < logs.length) {
                        const div = document.createElement('div');
                        div.textContent = logs[i];
                        if (term) term.appendChild(div);
                        if (progress) progress.style.width = ((i+1)/logs.length)*100 + '%';
                        i++;
                    } else {
                        clearInterval(this.introInterval);
                        setTimeout(() => {
                            this.hideSplash();
                            if (!localStorage.getItem('currentUser')) {
                                const auth = document.getElementById('auth-layer');
                                if (auth) auth.classList.remove('d-none');
                            } else {
                                if (typeof window.triggerLoginFlow === 'function') {
                                    window.triggerLoginFlow();
                                }
                            }
                        }, 150);
                    }
                }, 120);
            },

            openWindow(id) {
                if (this.windows[id]) { this.focusWindow(id); return; }
                const win = document.createElement('div');
                win.id = `win-${id}`;
                win.className = 'window animate__animated animate__zoomIn';
                const w = Math.min(window.innerWidth * 0.85, 1200);
                const h = window.innerHeight * 0.8;
                win.style.width = w + 'px';
                win.style.height = h + 'px';
                win.style.left = ((window.innerWidth - w) / 2) + 'px';
                win.style.top = ((window.innerHeight - h) / 2) + 'px';
                win.style.zIndex = ++this.zindex;
                win.innerHTML = `<div class="window-header"><span class="fw-bold"><i class="fas fa-terminal me-2"></i> ${id.toUpperCase()}</span><div class="window-controls"><span class="bg-warning" onclick="os.minimizeWindow('${id}')"></span><span class="bg-danger" onclick="os.closeWindow('${id}')"></span></div></div><div class="window-body" id="body-${id}"><div class="p-5 text-center"><i class="fas fa-spinner fa-spin fa-3x"></i></div></div>`;
                const container = document.getElementById('window-container');
                if (container) {
                    container.appendChild(win);
                    this.windows[id] = win;
                    this.addToTaskbar(id);
                    this.makeDraggable(win);
                }
            },

            closeWindow(id) {
                if (this.windows[id]) {
                    this.windows[id].classList.add('animate__zoomOut');
                    setTimeout(() => {
                        if (this.windows[id]) { this.windows[id].remove(); delete this.windows[id]; }
                        const t = document.getElementById(`task-${id}`);
                        if (t) t.remove();
                    }, 200);
                }
            },

            minimizeWindow(id) {
                if (this.windows[id]) {
                    const isMin = this.windows[id].style.display === 'none';
                    this.windows[id].style.display = isMin ? 'flex' : 'none';
                    const task = document.getElementById(`task-${id}`);
                    if (task) task.classList.toggle('active', !isMin);
                }
            },

            focusWindow(id) {
                if (this.windows[id]) {
                    this.windows[id].style.display = 'flex';
                    this.windows[id].style.zIndex = ++this.zindex;
                    document.querySelectorAll('.task-item').forEach(el => el.classList.remove('active'));
                    const task = document.getElementById(`task-${id}`);
                    if (task) task.classList.add('active');
                }
            },

            toggleWindow(id) {
                const win = this.windows[id];
                if (!win) {
                    if (id === 'dashboard') showDashboard();
                    else if (id === 'pentest') startGame('logica');
                    else if (id === 'soc') startDefenseMode();
                    else if (id === 'botwar') startBotWar();
                    else if (id === 'glossary') showGlossary();
                    else if (id === 'blackmarket') { if (typeof showBlackMarket === 'function') showBlackMarket(); }
                    return;
                }
                if (win.style.display === 'none') { this.minimizeWindow(id); this.focusWindow(id); }
                else if (win.style.zIndex == this.zindex) { this.minimizeWindow(id); }
                else { this.focusWindow(id); }
            },

            addToTaskbar(id) {
                const items = document.getElementById('taskbar-items');
                if (items) {
                    const item = document.createElement('div');
                    item.id = `task-${id}`;
                    item.className = 'task-item active';
                    item.textContent = id.toUpperCase();
                    item.onclick = () => this.toggleWindow(id);
                    items.appendChild(item);
                }
            },

            makeDraggable(el) {
                const header = el.querySelector('.window-header');
                let nx = 0, ny = 0, x = 0, y = 0;
                header.onmousedown = (e) => {
                    e.preventDefault(); nx = e.clientX; ny = e.clientY;
                    this.focusWindow(el.id.replace('win-', ''));
                    document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                    document.onmousemove = (e) => {
                        e.preventDefault(); x = nx - e.clientX; y = ny - e.clientY; nx = e.clientX; ny = e.clientY;
                        el.style.top = (el.offsetTop - y) + "px"; el.style.left = (el.offsetLeft - x) + "px";
                    };
                };
            }
        };
        window.os = os;
    </script>

    <!-- Dependencies -->
    <script src="js/i18n.js"></script>
    <script src="data/arsenal.js"></script>
    <script src="js/ai_generator.js"></script>
    <script src="js/gemma_optimizer.js"></script>
    <script src="js/defense_engine.js"></script>
    <script src="js/bot_war.js"></script>
    <script src="data/tecnicas.js"></script>
    <script src="js/offline.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <script>
        window.addEventListener('load', () => os.init());
    </script>
</body>
</html>
